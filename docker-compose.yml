services:
  frontend:
    build:
      context: ./frontend/aws-alert-frontend
      dockerfile: Dockerfile
    container_name: costspike-frontend
    ports:
      - "5173:8080"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend/aws-alert
      dockerfile: Dockerfile
    container_name: costspike-backend
    ports:
      - "8080:8080"
    environment:
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}