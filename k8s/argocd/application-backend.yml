apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: costspike-backend
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/shubhsJadhav95/AWS_COST_ALERT.git
    targetRevision: HEAD
    path: k8s/backend

  destination:
    server: https://kubernetes.default.svc
    namespace: costspike

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
