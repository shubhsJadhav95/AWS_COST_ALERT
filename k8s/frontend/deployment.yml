apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: costspike
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: costspike-frontend-deploy
        image: shubhsjadhav95/costspike-frontend:v1
        ports:
        - containerPort: 80