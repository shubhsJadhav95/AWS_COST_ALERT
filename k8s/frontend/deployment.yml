apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: costspike
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: costspike-frontend-deploy
        image: 347026173735.dkr.ecr.us-east-1.amazonaws.com/costspike-frontend:22
        ports:
        - containerPort: 8080
