apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: costspike
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: costspike-backend-deploy
        image: shubhsjadhav95/costspike-frontend:v1
        ports:
        - containerPort: 80